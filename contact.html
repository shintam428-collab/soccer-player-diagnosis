<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お問い合わせ | サッカー診断サイト</title>

<style>
*, *::before, *::after {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    max-width: 100%;
    margin: 0;
    overflow-x: hidden;
}

body {
    font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: #0f172a;
    background: #f4f7fb;
    line-height: 1.9;
}

.legal-page {
    width: min(100%, 920px);
    margin: 0 auto;
    padding: 48px 20px 28px;
}

.legal-card {
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid #e2e8f0;
    border-radius: 24px;
    box-shadow: 0 14px 34px rgba(15, 23, 42, 0.1);
    padding: 38px 34px;
    text-align: center;
}

.legal-title {
    margin: 0 0 10px;
    font-size: clamp(30px, 6vw, 46px);
    font-weight: 900;
    line-height: 1.25;
    color: #0f172a;
}

.legal-lead {
    margin: 0 auto 28px;
    max-width: 620px;
    color: #475569;
    font-weight: 700;
}

.contact-box {
    margin: 0 auto;
    padding: 28px 24px;
    max-width: 650px;
    border-radius: 18px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
}

.contact-box p {
    margin: 0 0 20px;
    color: #1e3a8a;
    font-size: 16px;
    font-weight: 700;
}

.contact-button {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 12px;
    background: #2563eb;
    color: #ffffff;
    font-size: 16px;
    font-weight: 900;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease;
}

.contact-button:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
}

.contact-button:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 3px;
}

.contact-note {
    margin: 20px auto 0;
    max-width: 620px;
    color: #64748b;
    font-size: 14px;
    font-weight: 700;
    text-align: left;
}

.legal-footer {
    margin-top: 26px;
    text-align: center;
    color: #64748b;
    font-size: 13px;
    font-weight: 700;
}

.legal-footer__links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.legal-footer a {
    color: #2563eb;
    font-weight: 900;
    text-decoration: none;
}

.legal-footer a:hover {
    text-decoration: underline;
}

@media (max-width: 600px) {
    .legal-page {
        padding: 28px 12px 20px;
    }

    .legal-card {
        padding: 26px 18px;
        border-radius: 18px;
    }

    .contact-box {
        padding: 22px 16px;
    }

    .contact-button {
        width: 100%;
        padding: 14px 16px;
    }

    .legal-footer__links {
        gap: 10px 12px;
    }
}
</style>
</head>

<body>

<main class="legal-page">

    <article class="legal-card">

        <h1 class="legal-title">お問い合わせ</h1>

        <p class="legal-lead">
            サッカー診断サイトに関するご質問・ご意見などは、
            以下のお問い合わせフォームからご連絡ください。
        </p>

        <div class="contact-box">

            <p>
                お問い合わせはGoogleフォームで受け付けています。
            </p>

            <a
                class="contact-button"
                href="https://docs.google.com/forms/d/e/1FAIpQLSdPWTXPvr0Z_qfJabNcqLzN8Yb6ADysH0S6dH8Hp7SKNVup-w/viewform?usp=header"
                target="_blank"
                rel="noopener noreferrer"
            >
                お問い合わせフォームを開く
            </a>

        </div>

        <p class="contact-note">
            お問い合わせ内容を確認後、必要に応じてご返信いたします。
            内容によっては返信までにお時間をいただく場合や、
            ご返信できない場合がありますので、あらかじめご了承ください。
        </p>

    </article>

    <footer class="legal-footer">

        <nav class="legal-footer__links" aria-label="フッターリンク">
            <a href="privacy.html">プライバシーポリシー</a>
            <a href="disclaimer.html">免責事項</a>
            <a href="operator.html">運営者情報</a>
            <a href="contact.html">お問い合わせ</a>
        </nav>

        <a href="index.html">トップページへ戻る</a>

    </footer>

</main>

</body>
</html>
